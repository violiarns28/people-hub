<a href="#main" class="skip-link" (click)="$event.preventDefault(); mainEl.focus()"
  >Skip to content</a
>

<div class="flex min-h-dvh">
  @if (drawerOpen()) {
    <div
      animate.leave="scrim-out"
      class="scrim fixed inset-0 z-30 lg:hidden"
      aria-hidden="true"
      (click)="closeDrawer(true)"
    ></div>
  }

  <aside
    #drawer
    id="primary-nav"
    class="drawer border-line bg-surface fixed inset-y-0 left-0 z-40 flex w-72 flex-col border-r lg:sticky lg:top-0 lg:z-auto lg:h-dvh lg:w-52 lg:shrink-0"
    [class.open]="drawerOpen()"
    [class.collapsed]="collapsed()"
    [attr.aria-label]="'Primary'"
  >
    <div class="border-line flex h-16 items-center justify-between gap-3 border-b px-5">
      <a
        routerLink="/employees"
        class="brand-link flex items-center gap-3 rounded-lg"
        aria-label="PeopleHub home"
        (click)="closeDrawer()"
      >
        <span class="brand-mark" aria-hidden="true"><app-icon name="users" [size]="18" /></span>
        <span class="text-lg font-semibold tracking-tight">PeopleHub</span>
      </a>
      <button
        type="button"
        class="btn-icon text-ink-2 hover:bg-surface-2 size-11 lg:hidden"
        aria-label="Close menu"
        (click)="closeDrawer(true)"
      >
        <app-icon name="x" [size]="20" />
      </button>
    </div>

    <nav class="flex-1 px-3 py-4" aria-label="Main">
      <ul class="space-y-1">
        <li>
          <a
            routerLink="/employees"
            routerLinkActive="active"
            class="nav-link press"
            (click)="closeDrawer()"
          >
            <app-icon name="users" [size]="18" />
            Employees
          </a>
        </li>
      </ul>
    </nav>

    <div class="px-3 pb-3">
      <div class="workspace-card flex items-center gap-3 rounded-lg p-3">
        <span class="workspace-tile" aria-hidden="true"
          ><app-icon name="building" [size]="18"
        /></span>
        <span class="min-w-0">
          <span class="block text-[13px]/4 font-semibold">PeopleHub workspace</span>
          <span class="text-ink-3 block truncate text-xs">Employee directory</span>
        </span>
      </div>
    </div>

    <div class="border-line border-t p-3">
      <app-user-menu (signOut)="askSignOut()" />
    </div>
  </aside>

  <button
    type="button"
    class="side-toggle border-line bg-surface text-ink-2 hover:text-brand hover:bg-brand-soft hidden size-8 items-center justify-center rounded-lg border shadow-sm lg:flex"
    [class.collapsed]="collapsed()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!collapsed()"
    (click)="toggleCollapsed()"
  >
    <svg
      class="side-toggle-icon"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <path class="panel-fill" d="M9 4v16" />
      <path class="panel-arrow" d="m16 9-3 3 3 3" />
    </svg>
  </button>

  <div class="min-w-0 flex-1" [attr.inert]="drawerOpen() ? '' : null">
    <header
      class="border-line bg-surface/90 sticky top-0 z-20 flex h-16 items-center justify-between gap-2 border-b px-3 backdrop-blur lg:hidden"
    >
      <button
        #menuButton
        type="button"
        class="btn-icon text-ink size-11"
        aria-label="Open menu"
        aria-controls="primary-nav"
        [attr.aria-expanded]="drawerOpen()"
        (click)="openDrawer()"
      >
        <app-icon name="menu" [size]="22" />
      </button>
      <a
        routerLink="/employees"
        class="brand-link flex items-center gap-2.5 rounded-lg"
        aria-label="PeopleHub home"
      >
        <span class="brand-mark" aria-hidden="true"><app-icon name="users" [size]="18" /></span>
        <span class="text-lg font-semibold tracking-tight">PeopleHub</span>
      </a>
      <button
        type="button"
        class="btn-icon theme-toggle text-ink-2 hover:bg-surface-2 hover:text-ink size-11"
        [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="toggleTheme()"
      >
        <span class="theme-icons" [class.is-dark]="isDark()" aria-hidden="true">
          <app-icon class="t-sun" name="sun" [size]="20" />
          <app-icon class="t-moon" name="moon" [size]="20" />
        </span>
      </button>
    </header>

    <main
      id="main"
      #mainEl
      tabindex="-1"
      class="rise-in mx-auto w-full max-w-[96rem] p-2 outline-none sm:px-4 lg:py-6"
    >
      <router-outlet />
    </main>
  </div>
</div>

<app-confirm-dialog
  [(open)]="signOutOpen"
  title="Sign out?"
  message="You will need to sign in again to see employee records."
  confirmLabel="Sign out"
  cancelLabel="Cancel"
  tone="danger"
  (confirmed)="signOut()"
/>

<app-confirm-dialog
  [open]="idle.warning()"
  title="Still there?"
  [message]="idleMessage()"
  confirmLabel="Stay signed in"
  cancelLabel="Sign out"
  tone="default"
  (confirmed)="stayAlive()"
  (cancelled)="signOut()"
/>
